name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_ENV: test
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  test-server:
    name: test-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run server tests
        run: |
          cd tandem/server && npm ci && npm test

  test-e2e:
    name: test-e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run e2e tests
        run: |
          cd tandem && npx playwright install --with-deps chromium && npx playwright test

  build-client:
    name: build-client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build client
        run: |
          cd tandem/client && npm ci && npm run build
